{%- include language-pair.html -%}
{%- if ll_found %}
    <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="{{ ll_other }}" href="{{ ll_href | absolute_url }}">
    {%- if page.lang == "en" %}
    <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
    {%- else %}
    <link rel="alternate" hreflang="x-default" href="{{ ll_href | absolute_url }}">
    {%- endif %}
{%- endif %}
    <script>
      (function () {
        var key = 'amneziageo-language';
        {%- if page.lang == "en" and ll_found %}
        // An English page opens in Russian for a reader who chose Russian or whose browser asks for it first.
        try {
          var chosen = localStorage.getItem(key);
          var browser = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          if (chosen === 'ru' || (!chosen && /^ru(-|$)/i.test(browser))) {
            location.replace({{ ll_href | relative_url | jsonify }});
            return;
          }
        } catch (e) {}
        {%- endif %}
        document.addEventListener('click', function (event) {
          var link = event.target.closest && event.target.closest('a.language');
          if (link) {
            try { localStorage.setItem(key, link.lang); } catch (e) {}
          }
        });
      })();
    </script>
