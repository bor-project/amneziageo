# Builds every platform in CI and publishes the results as a GitHub Release on every tag push (v*).
# Windows: a 2x2 matrix {x64, arm64} x {fdd (framework-dependent), scd (self-contained)} = 4 installers.
# Linux:   the amneziageo and amneziageo-gui Debian packages for amd64 and arm64.
# Android: one APK carrying arm64-v8a, armeabi-v7a and x86_64.
# Every job is its own runner with fail-fast off, so a broken target still ships the ones that build.
# Bundles are UNSIGNED. Once SignPath is configured (SIGNPATH_ORGANIZATION_ID variable +
# SIGNPATH_API_TOKEN secret) the sign job submits them to SignPath and the release ships signed; until
# then the release is unsigned. The signing key never lives in the repo or on the runner
# (installer.config.ci.json sets signingCert = null, so the local signtool path is skipped).
# The APK takes the SDK debug key unless the ANDROID_KEYSTORE_BASE64 secret holds a release keystore.
name: build & sign release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach the installers to the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false   # a broken arch (e.g. arm64) must not block the arches that do build
      matrix:
        include:
          - { arch: x64,   variant: fdd }
          - { arch: x64,   variant: scd }
          - { arch: arm64, variant: fdd }
          - { arch: arm64, variant: scd }
    steps:
      - name: Checkout (submodules + tags)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # engine version = `git describe --tags` of the amneziawg-windows submodule

      - name: Build the AmneziaWG engine (tunnel.dll)
        # The submodule's own build.cmd builds with stock Go, which since 1.21 has dropped Windows 7: the
        # DLL it emits imports bcryptprimitives.dll and never loads there. build-engine-win7.ps1 bootstraps
        # Go + llvm-mingw + wintun into .deps through that same build.cmd, then rebuilds <arch>\tunnel.dll
        # with the go-legacy-win7 toolchain and fails if the result is still not Windows 7 safe. It builds
        # any arch itself, so the arm64 build_plat patch build.cmd used to need is gone. The DLL is
        # gitignored (a build output, not vendored), so it must be built here before the .NET publish
        # consumes it.
        shell: pwsh
        run: ./amneziageo-windows/tools/build-engine-win7.ps1 -Arch ${{ matrix.arch }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # WiX v4/v5 is restored as an MSBuild SDK via the .wixproj PackageReferences during `dotnet build`.
      # If a real run reports a missing extension, add: `dotnet tool install --global wix` here.

      - name: Build installer (unsigned)
        shell: pwsh
        # `ci` selects installer.config.ci.json (signingCert = null) so the local signtool path is skipped.
        # On a tag push the version comes from the tag (v1.2.3.4 -> 1.2.3.4; use a 4-field tag); otherwise
        # build-installer falls back to 1.0.1.<commit-count>.
        run: |
          $script = 'amneziageo-windows/installer/AmneziaGeo.Windows.Installer.Bundle/build-installer.ps1'
          if ("$env:GITHUB_REF" -like 'refs/tags/v*') {
            # Strip the leading v and any prerelease suffix (v1.2.3.4-beta.1 -> 1.2.3.4): the installer needs a
            # numeric N.N.N.N version; the -beta marker lives on the tag/release, not in the binaries.
            $ver = "$env:GITHUB_REF_NAME" -replace '^v','' -replace '-.*$',''
            # A prerelease tag (v1.2.3.4-beta.1) bakes allowPrerelease=1 so the beta build stays on the beta
            # channel instead of offering a downgrade to the stable latest.
            $pre = [bool]("$env:GITHUB_REF_NAME" -match '-')
            & $script ci -Version $ver -Arch ${{ matrix.arch }} -Payload ${{ matrix.variant }} -Prerelease:$pre
          } else {
            & $script ci -Arch ${{ matrix.arch }} -Payload ${{ matrix.variant }}
          }

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned-${{ matrix.arch }}-${{ matrix.variant }}
          path: amneziageo-windows/installer/AmneziaGeo.Windows.Installer.Bundle/dist/*.exe
          if-no-files-found: error

  # Debian packages: amneziageo (agent, engine, console client, systemd unit) and amneziageo-gui.
  # Both are self-contained, so the target machine needs neither the .NET runtime nor Go. The arm64
  # package is cross-built on the x64 runner: `dotnet publish -r linux-arm64` and a CGO-free `go build`
  # both cross-compile, and dpkg-deb only writes the archive.
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout (submodules + tags)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # version falls back to 0.0.1.<commit count> off a tag

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: amneziageo-android/amneziawg-go/go.mod
          cache: false

      - name: Build the AmneziaWG daemon
        # Engine.targets refuses to build the agent until this binary exists; build-deb.sh then rebuilds
        # it for the package architecture.
        run: amneziageo-linux/tools/build-engine-linux.sh

      - name: Build the Debian packages
        shell: bash
        run: |
          set -euo pipefail
          args=(--arch ${{ matrix.arch }})
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"; ver="${ver%%-*}"
            args+=(--version "$ver")
            # A prerelease tag bakes the beta channel so the package does not offer the stable latest.
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          fi
          amneziageo-linux/tools/build-deb.sh "${args[@]}"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # One APK for all three ABIs. Release is AOT-compiled: a weak TV box starts about twice as fast.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (submodules + tags)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: amneziageo-android/libamneziawg-go/go.mod
          cache: false

      - name: Install the .NET Android workload
        run: dotnet workload install android

      - name: Ensure the SDK platforms the app targets
        # The runner image carries most of them; installing is idempotent and keeps the build off a
        # "missing android.jar" error when the image moves on.
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "platforms;android-36" > /dev/null

      - name: Build the native engine
        run: amneziageo-android/tools/build-engine-android.sh

      - name: Build the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          # A debug-signed APK never upgrades over one signed elsewhere: the SDK key is generated per
          # machine. Set the ANDROID_KEYSTORE_BASE64 secret to sign every release with one key.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          args=(--config Release)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"; ver="${ver%%-*}"
            args+=(--version "$ver")
          fi
          amneziageo-android/tools/build-apk.sh "${args[@]}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: amneziageo-android/tools/dist/*.apk
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    # Skipped until SignPath is wired up: gated on the SIGNPATH_ORGANIZATION_ID repository variable so the
    # release pipeline still publishes unsigned installers in the meantime. Set the variable (and the
    # SIGNPATH_API_TOKEN secret) to activate signing. NOTE: when enabled, this job must be turned into a
    # matrix over the 4 build artifacts (one submission each) - it currently handles a single artifact.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   variant: fdd }
          - { arch: x64,   variant: scd }
          - { arch: arm64, variant: fdd }
          - { arch: arm64, variant: scd }
    steps:
      - name: Download the unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-unsigned-${{ matrix.arch }}-${{ matrix.variant }}
          path: unsigned
      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: amneziageo
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          artifact-path: unsigned
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-signed-${{ matrix.arch }}-${{ matrix.variant }}
          path: signed/*.exe
          if-no-files-found: error

  # Publishes the GitHub Release that the app's auto-update reads. update.json + the installers, packages
  # and the APK are attached as assets. A stable client polls
  # https://github.com/<repo>/releases/latest/download/update.json; a prerelease (allowPrerelease) client
  # finds the newest release via the releases API. Either way the client builds its own installer name
  # (AmneziaGeo-<version>-<its build target>.exe) from the manifest version, so each arch/payload downloads
  # its own file; `setup` stays as a legacy fallback. Runs on a tag push whether or not signing ran,
  # preferring signed installers and falling back to the unsigned ones.
  publish:
    needs: [build, build-linux, build-android, sign]
    runs-on: ubuntu-latest
    # always() + tag: publish whatever built even if some target failed or the sign job was skipped. It does
    # NOT gate on needs.*.result, so a partial matrix (e.g. x64 ok, arm64 broken) still ships.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      # Grab every artifact of this run into artifacts/<name>/. Downloading by a specific name would fail
      # when that target did not build, so download all and pick below.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets and update manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          # Prefer signed over unsigned when both exist (signed dirs are globbed first; dedup by basename).
          for f in artifacts/installer-signed-*/*.exe artifacts/installer-unsigned-*/*.exe \
                   artifacts/deb-*/*.deb artifacts/apk/*.apk; do
            b=$(basename "$f")
            if [ ! -e "release/$b" ]; then cp "$f" "release/$b"; echo "asset: $b"; fi
          done
          count=$(ls release | wc -l)
          [ "$count" -ge 1 ] || { echo "nothing built; nothing to publish"; exit 1; }
          # The tag is the version every job was told to build with.
          VER="${GITHUB_REF_NAME#v}"; VER="${VER%%-*}"
          # Legacy fallback entry point = x64 framework-dependent. New clients ignore update.json.setup and
          # build their own per-build installer name; setup only serves clients with no baked build target.
          SETUP=$(ls release/AmneziaGeo-*-win-x64-fdd.exe 2>/dev/null | head -1 || true)
          if [ -z "$SETUP" ]; then
            SETUP=$(ls release/*.exe 2>/dev/null | head -1 || true)
            echo "WARNING: x64-fdd absent; auto-update entry = ${SETUP:-none}"
          fi
          SETUP_NAME=$([ -n "$SETUP" ] && basename "$SETUP" || echo '')
          # Self-describing manifest: version + channel (stable vs prerelease from the tag) + an installers
          # array (one per published asset: platform/arch/variant) so the check is scoped to the installed
          # distribution. `setup` stays a legacy fallback; new clients build their own per-build name.
          CHANNEL=stable
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then CHANNEL=prerelease; fi
          # SHA-256 lets the client verify the downloaded file before it runs it.
          # The slurp has to take all three loops; on the last one alone the other objects arrive raw.
          installers_json=$(
            {
            for f in release/AmneziaGeo-*.exe; do
              b=$(basename "$f")
              rest=${b#AmneziaGeo-${VER}-}; rest=${rest%.exe}   # win-<arch> (scd) or win-<arch>-<variant> (fdd)
              arch=$(echo "$rest" | sed -n 's/^win-\([^-]*\).*/\1/p')
              variant=$(echo "$rest" | sed -n 's/^win-[^-]*-\(.*\)/\1/p'); variant=${variant:-scd}
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              jq -n --arg name "$b" --arg platform windows --arg arch "$arch" --arg variant "$variant" --arg sha256 "$sha" \
                 '{name:$name, platform:$platform, arch:$arch, variant:$variant, sha256:$sha256}'
            done
            for f in release/*.deb; do
              b=$(basename "$f")
              rest=${b%.deb}                                   # <package>_<version>_<arch>
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              jq -n --arg name "$b" --arg platform linux --arg arch "${rest##*_}" --arg variant "${rest%%_*}" --arg sha256 "$sha" \
                 '{name:$name, platform:$platform, arch:$arch, variant:$variant, sha256:$sha256}'
            done
            for f in release/*.apk; do
              b=$(basename "$f")
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              # One package carries every ABI the engine is built for.
              jq -n --arg name "$b" --arg platform android --arg arch universal --arg variant apk --arg sha256 "$sha" \
                 '{name:$name, platform:$platform, arch:$arch, variant:$variant, sha256:$sha256}'
            done
            } | jq -s '.'
          )
          jq -n --arg version "$VER" --arg description "AmneziaGeo $VER" --arg channel "$CHANNEL" \
             --arg setup "$SETUP_NAME" --argjson installers "$installers_json" \
             '{version:$version, description:$description, channel:$channel, setup:$setup, installers:$installers}' \
             > release/update.json
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "--- release/ ---"; ls -la release
          echo "--- update.json ---"; cat release/update.json

      - name: Create or update the GitHub Release
        # This job does not checkout the repo, so gh has no git context: GH_REPO tells it the target repo.
        # Delete-then-create makes the publish idempotent so a re-run yields a pristine asset set.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          # A suffixed tag (v1.2.3.4-beta.1) ships as a prerelease so it never becomes the stable "latest";
          # only allowPrerelease builds discover it, via the GitHub releases API. Plain tags mark --latest.
          if [[ "$TAG" == *-* ]]; then CHANNEL="--prerelease"; else CHANNEL="--latest"; fi
          gh release create "$TAG" $CHANNEL --title "AmneziaGeo ${TAG#v}" --notes "AmneziaGeo ${TAG#v}" release/*
